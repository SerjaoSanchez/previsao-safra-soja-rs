[project]
name = "soja-rs"
version = "0.1.0"
description = "Previsão de rendimento municipal de soja no RS a partir de clima disponível até 31 de janeiro."
authors = [{ name = "Christian Domingues Sanchez" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "streamlit>=1.35",
    "plotly>=5.22",
    "geopandas>=0.14",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
